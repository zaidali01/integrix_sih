services:
  # 1. Node.js Backend API
  - type: web
    name: arguschain-api
    env: node
    plan: free
    rootDir: backend/api
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true

  # 2. Python ML UEBA Service
  - type: web
    name: arguschain-ueba
    env: python
    plan: free
    rootDir: backend/ueba-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    
  # 3. React Frontend (Static Site)
  - type: web
    name: arguschain-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # You can add rewrite rules for React Router
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
